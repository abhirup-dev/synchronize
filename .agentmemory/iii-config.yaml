workers:
  - name: iii-http
    config:
      port: 3211
      host: 127.0.0.1
      default_timeout: 180000
      cors:
        allowed_origins:
          - http://localhost:3211
          - http://localhost:3213
          - http://127.0.0.1:3211
          - http://127.0.0.1:3213
        allowed_methods: [GET, POST, PUT, DELETE, OPTIONS]
  - name: iii-state
    config:
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./runtime/data/state_store.db
  - name: iii-queue
    config:
      adapter:
        name: builtin
  - name: iii-pubsub
    config:
      adapter:
        name: local
  - name: iii-cron
    config:
      adapter:
        name: kv
  - name: iii-stream
    config:
      port: 3212
      host: 127.0.0.1
      adapter:
        name: kv
        config:
          store_method: file_based
          file_path: ./runtime/data/stream_store
  - name: iii-observability
    config:
      enabled: true
      service_name: synchronize-agentmemory
      exporter: memory
      sampling_ratio: 0.1
      metrics_enabled: true
      logs_enabled: true
      logs_console_output: false
  - name: iii-exec
    config:
      watch:
        - ../node_modules/@agentmemory/agentmemory/dist/**/*.mjs
      exec:
        - node ../node_modules/@agentmemory/agentmemory/dist/index.mjs
